org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
# Disable Kotlin incremental compilation to avoid Windows drive-root cache errors
# (workaround for incremental cache path roots mismatch during release builds)
kotlin.incremental=false
